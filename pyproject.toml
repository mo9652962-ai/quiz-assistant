[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quiz-assistant"
version = "0.1.0"
description = "Local-first question bank and practice assistant"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "typer>=0.15,<1",
  "rich>=13,<16",
  "uvicorn>=0.30,<1",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx2>=2,<3"]
remote = ["psycopg[binary]>=3.2,<4"]
ocr = ["Pillow>=10,<13", "pytesseract>=0.3.10,<1"]
package = ["pyinstaller>=6.0,<7"]

[project.scripts]
quiz = "quiz_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
